name: Update total downloads badge

on:
  schedule:
    - cron: '17 */6 * * *'
  release:
    types: [published]
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/scripts/download_badge.py'
      - '.github/workflows/download-badge.yml'

permissions:
  contents: write

concurrency:
  group: total-downloads-badge
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Count downloads from every public release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/download_badge.py
      - name: Save updated badge
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/badges/downloads.svg
          if ! git diff --cached --quiet; then
            git commit -m 'به‌روزرسانی آمار کل دانلودها'
            git pull --rebase origin master
            git push origin HEAD:master
          fi
